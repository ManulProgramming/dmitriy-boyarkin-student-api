spring.application.name=dmitriy-boyarkin-student-api
server.port=${SERVER_PORT:8080}

# Database settings come from the environment. No passwords are stored in Git.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/student_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:student_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# Individualisation
app.student-name=${APP_STUDENT_NAME:Dmitriy Boyarkin}
app.version=${APP_VERSION:v1.0-dmitriy-boyarkin}
app.seed.enabled=${APP_SEED_ENABLED:true}
